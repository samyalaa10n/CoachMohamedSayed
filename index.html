  <meta property="og:title" content="Coach Mohamed Sayed | Personal Trainer & Online Fitness Coaching">

  <meta property="og:type" content="website">

    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Oswald:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="ld"><i></i></div>

  <nav id="nv">
    <div class="w">
      <a href="#home" class="logo">
        <img src="images/ms-logo-for-dark.svg" alt="MS">
        <span data-ar="تدريب <b>اونلاين كوتش</b>" data-en="<b>Online</b> Personal Coaching"></span>
      </a>
      <div class="links" id="lk"></div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="lang"><button data-l="ar" class="on">العربية</button><button data-l="en">English</button></div>
        <button class="bg" id="bg" aria-label="Menu"><i></i><i></i><i></i></button>
      </div>
    </div>
  </nav>

  <header id="home">
    <div class="bl" style="width:420px;height:420px;top:5%;inset-inline-end:12px"></div>
    <div class="bl" style="width:300px;height:300px;bottom:0;inset-inline-start:-60px"></div>
    <div id="pts"></div>
    <div class="w">
      <div class="eye" data-ar="كابتن محمد سيد · تدريب لياقة أونلاين"
        data-en="COACH MOHAMED SAYED · ONLINE FITNESS COACHING"></div>
      <h1 data-ar="ابني النسخة <em>الأقوى</em> منك." data-en="Build Your <em>Stronger</em> Version."></h1>
      <p class="lead" data-ar="يقدّم كابتن محمد سيد برامج تدريب ومتابعة مخصصة، مصممة حسب هدف وخبرة كل متدرب."
        data-en="Coach Mohamed Sayed provides personalized fitness coaching and training programs designed around each client’s goals and experience.">
      </p>
      <div class="row"><a href="#subscribe" class="btn pri" data-ar="ابدأ رحلتك" data-en="Start Your Journey"></a><a
          href="#contact" class="btn" data-ar="تواصل مع الكابتن" data-en="Contact Coach"></a></div>
    </div>
    <div class="sd"><i></i></div>
  </header>

  <main>
    <section id="about">
      <div class="w ab">
        <div class="ph rv lb" id="coachImg" data-ph="Coach photo"></div>
        <div class="rv">
          <div class="tag" data-ar="عن المدرب" data-en="About"></div>
          <h2 data-ar="كابتن محمد سيد" data-en="Coach Mohamed Sayed"></h2>
          <p data-ar="أنا كابتن محمد سيد، بتمرن وبدرّب من 2019، وبدأت المشاركة في البطولات من 2021. حاصل على المركز الأول في بطولة حورس وبطولة شلبي كلاسيك، ولاعب 6 بطولات دولية، منهم بطولة أحمد علي وبطولة Iron Man. حاصل على شهادات معتمدة في التدريب من Gold’s Academy، وشهادة CPT من ISSA، وشهادة CPR. وحاليًا Personal Trainer في Gym H2O."
            data-en="I’m Coach Mohamed Sayed. I have been training and coaching since 2019 and started competing in 2021. I hold 1st place at the Horus Championship and the Shalaby Classic, and I have competed in 6 international competitions, including the Ahmed Ali Championship and the Iron Man Championship. I hold a Gold’s Academy training certification, an ISSA CPT certification, and a CPR certification. I am currently a Personal Trainer at Gym H2O.">
          </p>
          <div class="pills"><span data-ar="تدريب منذ 2019" data-en="Training Since 2019"></span><span
              data-ar="بطولات منذ 2021" data-en="Competing Since 2021"></span><span
              data-ar="Personal Trainer في Gym H2O" data-en="Personal Trainer at Gym H2O"></span></div>
          <div class="tl">
            <div><b>2015</b><span data-ar="بداية ممارسة التدريب وبناء الخبرة في مجال اللياقة البدنية."
                data-en="Started training and building experience in fitness."></span></div>

            <div><b>2019</b><span data-ar="بداية التدريب وتقديم التوجيه للآخرين."
                data-en="Started training and coaching others."></span></div>

            <div><b>2021</b><span data-ar="بداية المشاركة في البطولات والمنافسات."
                data-en="Started participating in competitions."></span></div>

            <div><b data-ar="الآن" data-en="Present"></b><span data-ar="مدرب شخصي في Gym H2O."
                data-en="Personal Trainer at Gym H2O."></span></div>
          </div>
        </div>
      </div>
    </section>

    <section id="achievements" class="alt">
      <div class="w">
        <div class="tag">02</div>
        <h2 data-ar="الإنجازات والبطولات" data-en="Achievements & Championships"></h2>
        <div class="g g3" id="ach"></div>
      </div>
    </section>

    <section id="certs">
      <div class="w">
        <div class="tag">03</div>
        <h2 data-ar="الشهادات المعتمدة" data-en="Certifications"></h2>
        <div class="g g3" id="cert"></div>
      </div>
    </section>

    <section id="services" class="alt">
      <div class="w">
        <div class="tag">04</div>
        <h2 data-ar="خدمات التدريب" data-en="Coaching Services"></h2>
        <div class="g g3" id="svc"></div>
      </div>
    </section>

    <section id="clients">
      <div class="w">
        <div class="tag">05</div>
        <h2 data-ar="تحولات المتدربين" data-en="Client Transformations"></h2>
        <div class="g g3" id="cl"></div>
        <div class="row" style="justify-content:center;margin-top:32px"><a href="#transformations" class="btn pri"
            data-ar="عرض كل التحولات" data-en="View All Transformations"></a></div>
      </div>
    </section>

    <section id="stats" class="alt">
      <div class="w">
        <div class="g g3" id="stg" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"></div>
        <p class="note" data-ar="الأرقام أعلاه أرقام تجريبية مؤقتة وسيتم استبدالها بالأرقام الحقيقية."
          data-en="The numbers above are temporary placeholders and will be replaced with real figures."></p>
      </div>
    </section>

    <section id="pricing">
      <div class="w">
        <div class="tag">07</div>
        <h2 data-ar="اختر خطة التدريب المناسبة لك" data-en="Choose Your Coaching Plan"></h2>
        <div class="g g3" id="pg"></div>
      </div>
    </section>

    <section id="subscribe" class="alt">
      <div class="w">
        <div class="tag">08</div>
        <h2 data-ar="ابدأ رحلتك الآن" data-en="Start Your Journey"></h2>
        <form id="fm" novalidate>
          <div class="sel" id="sel"></div>
          <label for="nm" data-ar="الاسم بالكامل *" data-en="Full Name *"></label><input type="text" id="nm"
            autocomplete="name"><span class="er" id="e_nm"></span>
          <label for="ag" data-ar="العمر *" data-en="Age *"></label><input type="number" id="ag" min="10" max="90"
            inputmode="numeric"><span class="er" id="e_ag"></span>
          <label for="gl" data-ar="الهدف من التدريب" data-en="Training Goal"></label>
          <select id="gl"></select>
          <div class="med">
            <div class="lb" data-ar="التاريخ المرضي" data-en="Medical History"></div>
            <small data-ar="هذه المعلومات للكابتن فقط ولا تُعد تشخيصًا أو نصيحة طبية."
              data-en="This information is for the coach only and is not a medical diagnosis or advice."></small>
            <div class="lb" data-ar="هل لديك أي مرض مزمن؟" data-en="Do you have any chronic disease?"></div>
            <div class="yn"><label><input type="radio" name="ch" value="1"><span data-ar="نعم"
                  data-en="Yes"></span></label><label><input type="radio" name="ch" value="0" checked><span data-ar="لا"
                  data-en="No"></span></label></div>
            <div class="lb" data-ar="هل سبق لك إجراء أي عملية جراحية؟" data-en="Have you had any previous surgery?">
            </div>
            <div class="yn"><label><input type="radio" name="sg" value="1"><span data-ar="نعم"
                  data-en="Yes"></span></label><label><input type="radio" name="sg" value="0" checked><span data-ar="لا"
                  data-en="No"></span></label></div>
            <div class="det" id="det"><label for="dt" data-ar="برجاء توضيح التفاصيل"
                data-en="Please provide details"></label><textarea id="dt"></textarea></div>
          </div>
          <label for="pt" data-ar="فترة التدريب السابقة" data-en="Previous Training Period"></label><select
            id="pt"></select>
          <label for="nt" data-ar="ملاحظات إضافية" data-en="Notes"></label><textarea id="nt"></textarea>
          <button type="submit" class="btn pri" data-ar="إرسال الطلب" data-en="Submit Request"></button>
        </form>
      </div>
    </section>

    <section id="contact">
      <div class="w">
        <div class="tag">09</div>
        <h2 data-ar="تواصل معنا" data-en="Contact"></h2>
        <div class="soc" id="soc"></div>
      </div>
    </section>
  </main>

  <section id="tpage">
    <div class="w">
      <a href="#clients" class="btn" style="min-height:44px;margin-bottom:24px" data-ar="→ العودة للرئيسية"
        data-en="← Back to Home"></a>
      <div class="tag">05</div>
      <h2 data-ar="تحولات المتدربين" data-en="Client Transformations"></h2>
      <div class="g g3" id="cl2"></div>
      <div class="row" style="justify-content:center;margin-top:32px"><button class="btn" id="more" data-ar="عرض المزيد"
          data-en="Load More"></button></div>
      <p class="note" data-ar="الصور والبيانات ستُضاف لاحقًا من خلال ملف الإعدادات. النتائج تختلف من شخص لآخر."
        data-en="Photos and details will be added later via the config. Results vary from person to person."></p>
    </div>
  </section>
  <footer>
    <div class="w">
      <div class="fg">
        <div>
          <div class="logo">Coach <b>Mohamed Sayed</b></div>
          <p style="color:var(--mut)">Online Fitness Coaching</p>
        </div>
        <div>
          <h4 data-ar="روابط سريعة" data-en="Quick Links"></h4><a href="#services" data-ar="الخدمات"
            data-en="Services"></a><a href="#pricing" data-ar="الأسعار" data-en="Pricing"></a><a href="#contact"
            data-ar="تواصل معنا" data-en="Contact"></a>
        </div>
        <div>
          <h4>Social</h4><a data-k="wa" target="_blank" rel="noopener">WhatsApp</a><a data-k="fb" target="_blank"
            rel="noopener">Facebook</a><a data-k="ig" target="_blank" rel="noopener">Instagram</a>
        </div>
      </div>
      <div class="cp">Copyright © 2026 Coach Mohamed Sayed</div>
    </div>
  </footer>

  <div class="fw"><a id="fwa" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24">
        <path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.6L3 21z" />
        <path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2L9 8.5z" />
      </svg></a><span data-ar="تواصل مع الكابتن" data-en="Chat with Coach"></span></div>
  <div id="lb"><button aria-label="Close">×</button>
    <div id="lbc"></div>
  </div>
